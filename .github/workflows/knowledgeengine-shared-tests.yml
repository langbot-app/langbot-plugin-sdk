name: KnowledgeEngine shared SDK verification

on:
  push:
    paths:
      - 'KnowledgeEngine/**'
      - '.github/workflows/knowledgeengine-shared-tests.yml'
  pull_request:
    paths:
      - 'KnowledgeEngine/**'
      - '.github/workflows/knowledgeengine-shared-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Install released SDK and test dependencies
        run: |
          uv venv
          uv pip install langbot-plugin==0.6.0b5 pytest pytest-asyncio \
            -r KnowledgeEngine/LangRAG/requirements.txt \
            -r KnowledgeEngine/DifyDatasetsConnector/requirements.txt \
            -r KnowledgeEngine/FastGPTConnector/requirements.txt \
            -r KnowledgeEngine/RAGFlowConnector/requirements.txt
      - name: Behavioral regressions (fake Host and HTTP provider)
        run: .venv/bin/python -m pytest KnowledgeEngine/certification-tests -q
      - name: LangRAG legacy unit and benchmark fixtures
        working-directory: KnowledgeEngine/LangRAG
        run: ../../.venv/bin/python -m unittest discover -s tests -v
      - name: Exact archives, real dependency prepare, discovery and RPC
        run: .venv/bin/python KnowledgeEngine/certification-tests/verify_candidates.py --evidence "$RUNNER_TEMP/ke-evidence"
      - name: Retain unsigned candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledgeengine-unsigned-candidates
          path: |
            ${{ runner.temp }}/ke-evidence/*.json
            ${{ runner.temp }}/ke-evidence/*.log
            ${{ runner.temp }}/ke-evidence/packages/**/*.lbpkg
