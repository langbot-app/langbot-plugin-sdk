name: LocalAgent tests

on:
  push:
    paths:
      - "Runner/LocalAgent/**"
      - ".github/workflows/local-agent-tests.yml"
  pull_request:
    paths:
      - "Runner/LocalAgent/**"
      - ".github/workflows/local-agent-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout plugins
        uses: actions/checkout@v4
        with:
          path: langbot-plugins

      - name: Checkout plugin SDK
        uses: actions/checkout@v4
        with:
          repository: langbot-app/langbot-plugin-sdk
          # Update this tested SDK revision together with Runner/LocalAgent/uv.lock.
          ref: c373fa370f2a20f475fc7c56f50556e1831defca
          path: langbot-plugin-sdk

      - name: Record SDK revision
        run: git -C langbot-plugin-sdk rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Keep environment outside the checkout
        run: |
          printf 'UV_PROJECT_ENVIRONMENT=%s/local-agent-venv\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked --extra dev
        working-directory: langbot-plugins/Runner/LocalAgent

      - name: Ruff check
        run: uv run --no-sync ruff check .
        working-directory: langbot-plugins/Runner/LocalAgent

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .
        working-directory: langbot-plugins/Runner/LocalAgent

      - name: Pytest
        run: uv run --no-sync pytest
        working-directory: langbot-plugins/Runner/LocalAgent
