name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        run: uv publish --token "$UV_PUBLISH_TOKEN"
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
