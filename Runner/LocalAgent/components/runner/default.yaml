apiVersion: langbot/v1
kind: Runner
metadata:
  name: default
  label:
    en_US: Local Agent
    zh_Hans: 本地 Agent
  description:
    en_US: Built-in agent with model fallback, tools, and knowledge retrieval.
    zh_Hans: 内置 Agent，支持模型 fallback、工具调用和知识库检索。
spec:
  usages: [agent]
  config:
    - name: model
      description:
        en_US: Primary/fallback model UUIDs and per-model reasoning levels. Host validates and applies reasoning for every request; this is per-pipeline configuration.
        zh_Hans: 主模型/备用模型 UUID 与各模型推理等级。由 Host 对每次请求校验并应用，属于流水线独立配置。
      label:
        en_US: Model
        zh_Hans: 模型
      type: model-fallback-selector
      required: true
      default:
        primary: ''
        fallbacks: []
        reasoning: {}
    - name: prompt
      label:
        en_US: Prompt
        zh_Hans: 提示词
      type: prompt-editor
      required: true
      default:
        - role: system
          content: "You are a helpful assistant."
    - name: knowledge-bases
      label:
        en_US: Knowledge Bases
        zh_Hans: 知识库
      type: knowledge-base-multi-selector
      required: false
      default: []
    - name: advanced-settings
      label:
        en_US: Advanced Settings
        zh_Hans: 高级设置
      description:
        en_US: Show tuning controls for retrieval, tools, timeouts, and context management.
        zh_Hans: 显示检索、工具、超时和上下文管理的调优选项。
      type: boolean
      required: false
      default: false
    - name: date-grounding
      label:
        en_US: Current Date Grounding
        zh_Hans: 当前日期锚定
      description:
        en_US: Add the current UTC date and a reminder to verify time-sensitive facts with available search tools.
        zh_Hans: 注入当前 UTC 日期，并提醒使用可用搜索工具核实有时效性的信息。
      type: boolean
      required: false
      default: true
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: timeout
      label:
        en_US: Timeout
        zh_Hans: 执行超时
      type: integer
      required: false
      default: 300
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: remove-think
      label:
        en_US: Remove Thinking Output
        zh_Hans: 移除思考内容
      type: boolean
      required: false
      default: false
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: retrieval-top-k
      label:
        en_US: Retrieval Top K
        zh_Hans: 知识库检索数量
      type: integer
      required: false
      default: 5
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: rerank-model
      label:
        en_US: Rerank Model
        zh_Hans: 重排序模型
      type: rerank-model-selector
      required: false
      default: ''
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: rerank-top-k
      label:
        en_US: Rerank Top K
        zh_Hans: 重排序保留数量
      type: integer
      required: false
      default: 5
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: max-tool-iterations
      label:
        en_US: Max Tool Iterations
        zh_Hans: 最大工具调用轮数
      type: integer
      required: false
      default: 100
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: tool-execution-mode
      description:
        en_US: Parallel is faster for independent tools. Use serial for dependent or side-effecting actions; result order does not guarantee execution order.
        zh_Hans: 并行适合独立工具；有依赖或副作用的操作请选择串行。结果排列不保证执行顺序。
      label:
        en_US: Tool Execution Mode
        zh_Hans: 工具执行模式
      type: select
      required: false
      default: parallel
      options:
        - name: parallel
          label:
            en_US: Parallel
            zh_Hans: 并行
        - name: serial
          label:
            en_US: Serial
            zh_Hans: 串行
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: max-tool-result-chars
      label:
        en_US: Max Tool Result Characters
        zh_Hans: 最大工具结果字符数
      type: integer
      required: false
      default: 20000
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: context-history-fetch-limit
      label:
        en_US: History Fetch Limit
        zh_Hans: 历史消息拉取数量
      type: integer
      required: false
      default: 50
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: context-window-tokens
      label:
        en_US: Context Window Tokens
        zh_Hans: 上下文窗口 Token 数
      type: integer
      required: false
      default: 200000
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: context-reserve-tokens
      label:
        en_US: Reserved Output Tokens
        zh_Hans: 输出保留 Token 数
      type: integer
      required: false
      default: 16384
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: context-keep-recent-tokens
      label:
        en_US: Recent Context Tokens
        zh_Hans: 最近上下文 Token 数
      type: integer
      required: false
      default: 20000
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: context-summary-tokens
      label:
        en_US: Summary Tokens
        zh_Hans: 摘要 Token 数
      type: integer
      required: false
      default: 8000
      show_if:
        field: advanced-settings
        operator: eq
        value: true
  capabilities:
    streaming: true
    tool_calling: true
    knowledge_retrieval: true
    multimodal_input: true
    skill_authoring: true
    interrupt: true
    steering: true
  permissions:
    models:
      - count_tokens
      - invoke
      - stream
      - rerank
    tools:
      - detail
      - call
    knowledge_bases:
      - list
      - retrieve
    history:
      - page
execution:
  python:
    path: default.py
    attr: DefaultRunner
